name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @campuspilot/web exec playwright install --with-deps chromium
      - run: pnpm --filter @campuspilot/web test:e2e --project=chromium

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: campus_test
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus -d campus_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e "apps/api[dev]"
      - run: ruff format --check apps/api/campus_pilot apps/api/tests evals/run_evals.py
      - run: ruff check apps/api/campus_pilot apps/api/tests evals/run_evals.py
      - run: mypy --config-file apps/api/pyproject.toml apps/api/campus_pilot
      - run: pytest apps/api --cov=campus_pilot
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://campus:campus@localhost:5432/campus_test
          TEST_REDIS_URL: redis://localhost:6379/1
      - run: python evals/run_evals.py
      - run: pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
