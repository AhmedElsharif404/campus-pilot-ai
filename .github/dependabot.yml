version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
