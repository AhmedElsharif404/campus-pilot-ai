[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "campus-pilot-api"
version = "0.1.0"
description = "Privacy-aware academic planning API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "boto3==1.40.32",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "opentelemetry-api==1.37.0",
  "opentelemetry-exporter-otlp==1.37.0",
  "opentelemetry-instrumentation-fastapi==0.58b0",
  "opentelemetry-instrumentation-sqlalchemy==0.58b0",
  "opentelemetry-sdk==1.37.0",
  "prometheus-client==0.22.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "pypdf==6.16.2",
  "pyjwt==2.13.0",
  "python-multipart==0.0.32",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.13.0"
]

[tool.hatch.build.targets.wheel]
packages = ["campus_pilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires Docker services"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"campus_pilot/seed.py" = ["S105"]
"tests/conftest.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
